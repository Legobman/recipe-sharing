<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="navbar">
            <button id="home">Home</button>
            <button id="breakfast">Breakfast</button>
            <button id="dessert">Dessert</button>
        </div>
        <div class="navbar">
            <input type="text" placeholder="username" id="username">
            <input type="password" placeholder="password" id="password">
            <button id="login-btn">Login</button>
            <button id="logout-btn">Logout</button>
            <button id="reg-btn">Register</button>
        </div>
    </nav>
    <h1 id="title">Matthew's Recipe Sharing Website</h1>
    <!-- register form -->
    <form id="reg-form">
        <h1>New User</h1>
        <input type="text" placeholder="username" id="reg-username" required>
        <input type="password" placeholder="password" id="reg-password" required>
        <button type="button" id="addUser" class="btn">Create Account</button>
    </form>
    <div id="recipe-details" class="recipe-box">
    </div>
    <h1>Recipe List</h1>
    <div id="recipes-container">
    </div>
    <form id="form-container">
        <h1>New Recipe</h1>
        <input type="text" placeholder="Recipe Name" name="name" id="name" required>
        <input type="text" placeholder="Recipe Type" name="type" id="type" required>
        <input type="text" placeholder="x {name}, x {name}" name="ingredients" id="ingredients" required>
        <input type="text" placeholder="Recipe Steps" name="steps" id="steps" required>
        <button type="submit" id="save-recipe" class="btn">Save</button>
    </form>
</body>
</html>
