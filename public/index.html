<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Recipe List</h1>
    <div id="recipes-container">

    </div>
    <form id="form-container">
        <h1>New Recipe</h1>
        <input type="text" placeholder="Recipe Name" name="name" id="name" required>
        <input type="text" placeholder="Recipe Type" name="type" id="type" required>
        <input type="text" placeholder="Product Ingredients" name="ingredients" id="ingredients" required>
        <input type="textbox" placeholder="Product Steps" name="steps" id="steps" required>
        <button type="submit" id="save-recipe" class="btn">Save</button>
    </form>

</body>
</html>
